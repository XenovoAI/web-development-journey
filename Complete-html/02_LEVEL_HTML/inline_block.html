<!--Inline vs Block

~ Block elements takes up the full-width available whole block: start from the new line.
~ Inline Elements takes up only necessary width: DONT start from new line -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Harshit Patidar</h1><h2>THE BOSS</h2>
</body>
</html>
