<!DOCTYPE html>
<html lang="en">
<head>
    <title>FORM</title>
</head>
<body>
    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Mail:</label>
        <input type="email" required placeholder="abc@gmail.com">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Date:</label>
        <input type="date">
        <br><br>

        <label>Month:</label>
        <input type="month">
        <br><br>

        <label>Time:</label>
        <input type="time">
        <br><br>

        <label>Gender:</label><br>
        <label>Male</label>
        <input type="radio" name="male">
        <br>
        <label>Female</label>
        <input type="radio"><br>
        <br>

        <label>Hobby:</label><br>
        <input type="checkbox"checked>
        <label>Reading</label><br>
        <input type="checkbox">
        <label>Coding</label><br>
        <input type="checkbox">
        <label>Sleeping</label><br>
        <br>

        <label>Location:</label>
        <select>
            <option>Bhopal</option>
            <option>Indore</option>
            <option>Vadodara</option>
            <option>Mars</option>
        </select>
        <br><br>

        <label>Address:</label>
        <textarea></textarea>
        <br><br>
         <label>Submit:</label>
        <input type="submit" value="Click Here">
        <input type="reset" value="Erase">


        </form>
</body>
</html>
